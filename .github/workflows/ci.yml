name: Development checks
'on':
  pull_request:
    branches:
    - dev
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Test and build JavaScript
      run: |
        npm ci
        npm test
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Test Python helpers and build wheel
      run: |
        python -m pip install 'setuptools>=77' wheel build pytest '.[notebook]'
        python -m pytest -q tests/python
        python -m build --wheel
